[package]
name = "boomerang"
version = "0.8.2"
edition = "2021"
description = "A tmux-popup TUI for browsing, searching, creating, editing, and closing GitHub issues in the current repo"
license = "MIT"

[[bin]]
name = "boomerang"
path = "src/main.rs"

[package.metadata.tui-utils]
launch = "popup"
popup_flags = "-E -B -w 84 -h 60%"
config_isolation = "xdg"

[dependencies]
anyhow = "1"
crossterm = "0.29"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
